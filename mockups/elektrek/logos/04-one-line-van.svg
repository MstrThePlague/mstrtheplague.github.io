  <text x="402.500" y="478" font-family="'Gill Sans','Gill Sans MT','Avenir Next',sans-serif" font-size="13" letter-spacing="5" fill="#1E4A4F" text-anchor="middle">HAND-BUILT ELECTRIC CAMPERS · BUDE</text>
